title = "lab-site gitleaks config"

[extend]
useDefault = true

# The Cloudflare Web Analytics beacon token in layouts/_default/baseof.html is
# public-by-design: it ships in the HTML to every visitor's browser as a site
# identifier, not a credential. Committing it is correct, not a leak — the only
# exposure is someone posting junk events to the analytics property, which is
# inherent to the product. See Vikunja task #1880.
[allowlist]
description = "Cloudflare Web Analytics beacon token (public-by-design, ships to every visitor)"
# Scoped to the token value itself, not the file, so any other secret that
# lands in the template is still caught.
regexes = [
  '''38132c2e2015480686f8b15f3b8f7cd3''',
]
